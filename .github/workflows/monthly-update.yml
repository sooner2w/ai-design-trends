name: Monthly Content Refresh

# Superseded 2026-08-31 by the scheduled Claude cloud routine
# "research.breon.ai monthly refresh" (1st of month, 15:00 UTC), which follows
# REFRESH.md and does sourced research rather than unsourced generation.
# The cron trigger is removed so this stops failing monthly on the missing
# ANTHROPIC_API_KEY secret. Still runnable by hand from the Actions tab.
on:
  workflow_dispatch:        # manual "Run workflow" from the Actions tab only

permissions:
  contents: write           # let the built-in GITHUB_TOKEN push the refreshed content

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run monthly content refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_content.py

      - name: Commit and push updated files
        run: |
          git config user.name "AlphaStack Bot"
          git config user.email "bot@alphastackapp.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No content changes this month — nothing to commit."
            exit 0
          fi
          git commit -m "Monthly content refresh — $(date +'%B %Y')"
          git push
