name: Monthly Content Refresh

on:
  schedule:
    - cron: '7 9 1 * *'   # 09:07 UTC on the 1st of each month (off-peak minute)
  workflow_dispatch:        # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write           # let the built-in GITHUB_TOKEN push the refreshed content

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run monthly content refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_content.py

      - name: Commit and push updated files
        run: |
          git config user.name "AlphaStack Bot"
          git config user.email "bot@alphastackapp.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No content changes this month — nothing to commit."
            exit 0
          fi
          git commit -m "Monthly content refresh — $(date +'%B %Y')"
          git push
